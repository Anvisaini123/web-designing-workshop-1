<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes and input validation</title>
</head>
<body>
    <form action="submit.php" method="post">
        <input type="text" name="fullname" placeholder="Full Name" required><br><br>
        <input type="email" name="email" placeholder="you@college.edu" required><br><br>
        <input type="tel" name="mobile" placeholder=" 10 digit Mobile " pattern="[0-9]{10}" title="exact 10 digits"><br><br>
        <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required><br><br>
        <input type="number" name="age" placeholder="Age (17-30)" min="17" max="30" required><br><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
