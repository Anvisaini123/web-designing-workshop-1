<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <h4>Image</h4>
    <img src="campus.jpg" alt="College Campus" width="150" height="150">
    <h4>Video</h4>
    <video width="200" controls>
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <h4>Audio</h4>
    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <h4>Youtube</h4>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/V72yOMozZo4?si=r7gpur_yD-Vezbb-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
