<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested and responsive Tables</title>
</head>
<body>
    <div style="overflow-x: auto;">
        <table border="1" cellpadding="10" cellspacing="0">
            <tr>
                <th>Day</th>
                <th>Lab Batches</th>
                <th>Faculty</th>
                <th>Room</th>
                <th>Time</th>
            </tr>
            <tr align="center">
                <td>Friday</td>
                <td>
                    <table border="1" cellpadding="6" cellspacing="0">
                        <tr>
                            <th>Batch</th>
                            <th>System</th>
                        </tr>
                        <tr align="left">
                            <td>A1</td>
                            <td>PC 1-20</td>
                        <tr align="left">
                            <td>A2</td>
                            <td>PC 21-40`</td>
                        </tr>
                    </table>
                </td>
                <td>Dr. Sharma</td>
                <td>Lab 2</td>
                <td>2-4 PM</td>
            </tr>
        </table>
    </div>
</body>
</html>
