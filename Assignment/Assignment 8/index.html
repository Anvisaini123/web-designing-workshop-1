<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlinks and Images</title>
</head>
<body>
    <p id="top">Links demo</p>
    <a href="https://example.com" target="_blank">External Link</a><br>
    <a href="#bottom">Jump to Bottom</a><br>
    <a href="mailto:info@example.com">Email Us</a><br>
    <a href="https://example.com"><img src="logo.png" alt="Logo" width="100" height="50"></a>
    <br><br><br><br><br><br><br><br><br><br><br>
    <p id="bottom">Bottom. <a href="#top">Back to Top</a></p>
</body>
</html>
