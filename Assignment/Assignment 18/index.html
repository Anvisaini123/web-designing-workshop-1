<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
</head>
<body style="font-family: Georgia, serif; margin: 20px;">
    <header style="background-color: navy; color: white; padding: 15px; text-align: center;">
        <h1>ABC College Admission 2026</h1>
    </header>
    <main style="width: 75%; margin: 0 auto;">
        <h2>Courses and Fees</h2>
        <table border="1" cellpadding="6" style="width: 100%;">
            <caption><b>Available Courses</b></caption>
            <tr style="background-color: lightgray;">
                <th scope="col">Course</th>
                <th scope="col">Seats</th>
                <th scope="col">Fees</th>
            </tr>
            <tr>
                <td>BTECH CSE</td>
                <td>120</td>
                <td>&#8377; 90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377; 45,000</td>
            </tr>
        </table>
        <br>
        <form style="border: 1px solid black; color: black; padding: 15px; border-radius: 5px;">
            <legend>Application Form</legend>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required style="width: 50%;"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required style="width: 50%;"><br><br>
            <label for="course">Course:</label><br>
            <select id="course" required>
                <option value="">B.tech CSE</option>
                <option value="btech_cse">BCA</option>
            </select><br><br>
            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" rows="4" style="width: 85%;"></textarea><br><br>
            <button type="submit" style="background-color: grey;">Apply</button>
        </form>
        </main>
        <br>
        <footer style="background-color: navy; color: white; padding: 8px; text-align: center;">
            &copy; 2026 ABC College
        </footer>

</body>
</html>
